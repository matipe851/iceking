<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#e6f0f5">
<title>Ice King · Sabores</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E❄️%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Work+Sans:wght@400;500;600;700&display=swap">
<style>
/* "Heladera de kiosco": fixed background of shelves stocked with vapes (built from real stock colors) behind frosted glass.
   Layout: hero (name + price sticker) · sticky filter · flavor slots grid (1 → 2 → 3 cols) · fixed order bar. */
:root{
  --frost:#e6f0f5; --glass:rgba(240,248,252,.78); --steel:#9fb3c1; --ink:#0e2a44; --muted:#4f6a80; --line:rgba(14,42,68,.12);
  --led:#13b5ea; --tag:#ffd23f; --tag-ink:#3a2a00; --wa:#14a85a; --low:#d9480f;
  --display:"Big Shoulders Display", "Arial Narrow", system-ui, sans-serif; --body:"Work Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--frost)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.5;overflow-x:hidden;padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--led);outline-offset:3px}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* the fridge: shelves of vapes + cold light + frost */
.fridge{position:fixed;inset:0;z-index:-2;pointer-events:none;background-color:#cfe3ec;background-repeat:repeat;background-size:auto 210px;background-position:center top}
.fridge::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(230,240,245,.35) 30%,rgba(230,240,245,.7)),
             radial-gradient(120% 60% at 50% 0%,rgba(255,255,255,.75),transparent 70%)}
.glass{position:fixed;inset:0;z-index:-1;pointer-events:none;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
  background:linear-gradient(100deg,transparent 0 38%,rgba(255,255,255,.28) 40%,transparent 46% 100%)}

.wrap{max-width:1040px;margin:0 auto;padding-inline:16px}

/* hero */
.hero{padding-top:calc(30px + env(safe-area-inset-top,0px));padding-bottom:6px;display:grid;justify-items:center;text-align:center;gap:10px}
.door{width:100%;max-width:640px;background:var(--glass);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);
  border:1px solid rgba(255,255,255,.9);border-radius:28px;padding:26px 20px 22px;box-shadow:0 30px 60px -30px rgba(14,42,68,.45);display:grid;justify-items:center;gap:10px;position:relative}
.brand{font-weight:600;font-size:14px;color:var(--muted)}
.title{margin:0;font-family:var(--display);font-weight:900;font-size:clamp(64px,19vw,132px);line-height:.82;letter-spacing:-.01em;text-transform:uppercase;color:var(--ink)}
.title small{display:block;font-size:.3em;font-weight:800;letter-spacing:.02em;color:var(--led);margin-top:.18em}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:99px;background:#fff;border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--muted)}
.chip b{color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--wa)}
@media (prefers-reduced-motion:no-preference){.dot{animation:blink 2.4s ease-in-out infinite}@keyframes blink{50%{opacity:.35}}}

/* price sticker (the offer) */
.offer{position:relative;margin-top:8px;padding:14px 22px 14px;background:var(--tag);color:var(--tag-ink);border-radius:14px;transform:rotate(-2.5deg);
  box-shadow:0 2px 0 rgba(0,0,0,.08),0 14px 30px -14px rgba(120,80,0,.55);text-align:center;max-width:100%}
.offer::before{content:"";position:absolute;left:14px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:var(--frost);box-shadow:inset 0 1px 2px rgba(0,0,0,.25)}
.offer .lbl{display:block;font-weight:700;font-size:13px}
.offer .big{display:flex;align-items:baseline;justify-content:center;gap:.14em;white-space:nowrap;font-family:var(--display);font-weight:900;line-height:.95;padding-left:12px}
.offer .n{font-size:clamp(46px,13vw,84px)}
.offer .x{font-size:clamp(26px,7vw,44px)}
.offer .p{font-size:clamp(40px,11vw,74px)}
.offer .sub{font-weight:600;font-size:14px}
.offer .txt{font-family:var(--display);font-weight:800;font-size:clamp(26px,7vw,40px);line-height:1.05;white-space:pre-line;padding-left:12px}
.save{color:var(--wa);font-weight:700}
.offer .save{color:#0b6b37}

/* filters */
.bar{position:sticky;top:0;z-index:4;padding:12px 0 10px;margin-top:10px}
.seg{display:flex;gap:6px;justify-content:center}
.seg button{border:1px solid var(--line);background:rgba(255,255,255,.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:99px;padding:9px 16px;font-weight:600;font-size:14.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

/* flavor slots */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px;padding-top:4px}
.card{--c:#13b5ea;position:relative;display:grid;grid-template-columns:62px 1fr;gap:14px;align-items:center;padding:14px 14px 14px 12px;border-radius:20px;
  background:rgba(255,255,255,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.95);box-shadow:0 12px 30px -22px rgba(14,42,68,.5)}
.card.in{box-shadow:0 0 0 2px var(--c),0 16px 34px -20px color-mix(in srgb,var(--c) 70%,transparent)}
.slot{height:108px;border-radius:14px;display:grid;place-items:end center;padding-bottom:8px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 14%,#fff),color-mix(in srgb,var(--c) 26%,#fff));border-bottom:4px solid var(--steel)}

.name{margin:0;font-family:var(--display);font-weight:800;font-size:25px;line-height:1;letter-spacing:.005em;text-transform:uppercase;text-wrap:balance}
.desc{margin:6px 0 0;color:var(--muted);font-size:13.5px;line-height:1.35}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:99px}
.tag.ice{color:#0a5f7d;background:#d6f2fc}
.tag.low{color:#fff;background:var(--low)}
.foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
.price{font-family:var(--display);font-weight:800;font-size:28px;line-height:1}
.add{border:0;border-radius:12px;padding:11px 16px;font-weight:700;color:#fff;background:var(--ink)}
.add:hover{background:color-mix(in srgb,var(--ink) 85%,var(--led))}
.qty{display:flex;align-items:center;gap:2px;border-radius:12px;padding:3px;background:var(--frost)}
.qty button{width:40px;height:40px;border:0;border-radius:10px;background:#fff;font-size:20px;font-weight:700;color:var(--ink)}
.qty button:disabled{opacity:.35;cursor:not-allowed}
.qty span{min-width:26px;text-align:center;font-weight:700;font-size:16px}
.msg{color:var(--muted);text-align:center;padding:50px 16px;background:var(--glass);border-radius:20px}
.upd{color:var(--muted);font-size:13px;text-align:center;padding:26px 0 6px}

/* order bar */
.cart{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:6;width:min(560px,calc(100% - 20px));
  display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 10px 10px 18px;border-radius:20px;background:var(--ink);color:#fff;box-shadow:0 22px 44px -16px rgba(14,42,68,.7)}
.cart small{display:block;color:#a9c3d6;font-size:13px;font-weight:500}
.cart small .save{color:#7dffb1}
.cart b{font-family:var(--display);font-size:28px;font-weight:800;line-height:1.05}
.wa{display:inline-flex;align-items:center;gap:8px;border-radius:14px;padding:13px 18px;font-weight:700;text-decoration:none;white-space:nowrap;color:#fff;background:var(--wa)}
.wa:hover{filter:brightness(1.08)}
.wa[aria-disabled="true"]{background:#3b5568;color:#a9c3d6;pointer-events:none}
.wa svg{width:19px;height:19px;fill:currentColor}
@media (prefers-reduced-motion:no-preference){.cart.bump{animation:bump .35s ease-out}@keyframes bump{40%{transform:translateX(-50%) scale(1.03)}}}

/* foto del vape + animación */
.slot{position:relative;perspective:500px;overflow:visible;background:radial-gradient(60% 50% at 50% 60%,color-mix(in srgb,var(--c) 45%,#fff),color-mix(in srgb,var(--c) 14%,#fff) 75%)}
.slot img{height:94px;width:auto;display:block;filter:drop-shadow(0 8px 8px rgba(14,42,68,.28));transform-style:preserve-3d}
.slot.spin img{animation:spin360 .95s cubic-bezier(.35,.7,.3,1)}
@keyframes spin360{0%{transform:rotateY(0) translateY(0)}50%{transform:rotateY(180deg) translateY(-6px)}100%{transform:rotateY(360deg) translateY(0)}}
.puff{position:absolute;left:50%;top:6px;width:0;height:0;pointer-events:none;z-index:2}
.puff span{position:absolute;left:-17px;top:-12px;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle,#fff 0%,rgba(214,228,236,.95) 45%,rgba(190,208,220,.5) 62%,transparent 72%);filter:blur(1.5px);opacity:0;animation:puff 1.6s ease-out forwards}
.puff span:nth-child(1){animation-delay:.55s}
.puff span:nth-child(2){animation-delay:.7s;--dx:-16px}
.puff span:nth-child(3){animation-delay:.85s;--dx:14px}
.puff span:nth-child(4){animation-delay:1s;--dx:-4px}
@keyframes puff{0%{opacity:0;transform:translate(0,6px) scale(.4)}20%{opacity:1}100%{opacity:0;transform:translate(var(--dx,6px),-58px) scale(2.3)}}

/* age gate */
.gate{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:24px 16px;background:rgba(14,42,68,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.gate-card{width:100%;max-width:380px;text-align:center;display:grid;gap:12px;padding:28px 22px;border-radius:24px;background:#fff;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.gate-card h2{margin:0;font-family:var(--display);font-size:38px;font-weight:900;text-transform:uppercase;line-height:1}
.gate-card p{margin:0 0 6px;color:var(--muted);font-size:14.5px}
.gate-card button{border-radius:14px;padding:14px;font-weight:700;border:1px solid var(--line);background:#fff}
.gate-card .yes{border:0;color:#fff;background:var(--ink)}
@media (max-width:420px){.door{padding:22px 14px 18px;border-radius:24px}.card{grid-template-columns:54px 1fr}.slot{height:96px}.slot img{height:80px}}
/* sabores sin stock: se muestran apagados */
.card.out{opacity:.6}
.card.out .slot img{filter:grayscale(1)}
.card.out .price{text-decoration:line-through;opacity:.6}
.card.out .add{background:#9aa5b5;cursor:not-allowed}
.tag.out{color:#fff;background:#4b5563}

/* sorteo: boleta para compartir el catálogo */
.raffle{margin:14px auto 0;max-width:640px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:14px;padding:16px 16px 16px 20px;border-radius:22px;
  background:var(--ink);color:#fff;position:relative;box-shadow:0 22px 44px -22px rgba(14,42,68,.7)}
.raffle::before,.raffle::after{content:"";position:absolute;right:118px;width:18px;height:18px;border-radius:50%;background:var(--frost)}
.raffle::before{top:-9px}.raffle::after{bottom:-9px}
.raffle h2{margin:0;font-family:var(--display);font-weight:900;font-size:30px;line-height:.95;text-transform:uppercase}
.raffle p{margin:6px 0 0;color:#a9c3d6;font-size:14px;line-height:1.35}
.raffle .go{border:0;border-radius:14px;padding:14px 16px;font-weight:700;background:var(--tag);color:var(--tag-ink);white-space:nowrap}
.raffle .go:hover{filter:brightness(1.05)}
@media (max-width:420px){.raffle{grid-template-columns:1fr}.raffle::before,.raffle::after{display:none}.raffle .go{width:100%}}
.sheet{position:fixed;inset:0;z-index:15;display:grid;place-items:end center;background:rgba(14,42,68,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
@media (min-width:560px){.sheet{place-items:center}}
.sheet-card{width:100%;max-width:440px;max-height:92vh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:24px 20px calc(22px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}
@media (min-width:560px){.sheet-card{border-radius:24px}}
.sheet-card h2{margin:0;font-family:var(--display);font-weight:900;font-size:34px;line-height:1;text-transform:uppercase}
.sheet-card p{margin:0;color:var(--muted);font-size:14.5px}
.sheet-card label{display:grid;gap:5px;font-weight:600;font-size:14px}
.sheet-card input[type=text],.sheet-card input[type=tel]{font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--frost);color:var(--ink)}
.sheet-card input:focus-visible{outline:3px solid var(--led);outline-offset:1px}
.sheet-card .chk{display:flex;gap:10px;align-items:flex-start;font-weight:500;font-size:13.5px;color:var(--muted)}
.sheet-card .chk input{margin-top:3px;width:18px;height:18px;flex:none}
.sheet-card details{font-size:13px;color:var(--muted)}
.sheet-card summary{cursor:pointer;font-weight:600;color:var(--ink)}
.sheet-card .err{color:var(--low);font-size:13.5px;font-weight:600;min-height:1em}
.sheet-card .primary{border:0;border-radius:14px;padding:15px;font-weight:700;color:#fff;background:var(--ink)}
.sheet-card .close{border:1px solid var(--line);border-radius:14px;padding:12px;font-weight:600;background:#fff}
.sheet-card .wa{justify-content:center;font-size:16px;padding:15px}
.mylink{display:flex;gap:8px}
.mylink input{flex:1;min-width:0;font:inherit;font-size:14px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--frost);color:var(--ink)}
.mylink button{border:1px solid var(--line);border-radius:12px;padding:0 14px;font-weight:600;background:#fff}
.steps{margin:0;padding-left:20px;color:var(--muted);font-size:14px;display:grid;gap:4px}
</style>
</head>
<body>
<div class="fridge" id="fridge" aria-hidden="true"></div>
<div class="glass" aria-hidden="true"></div>

<div class="gate" id="gate" hidden>
  <div class="gate-card">
    <h2>¿Sos mayor de 18?</h2>
    <p>Productos con nicotina. Solo para mayores de edad.</p>
    <button class="yes" id="gate-yes">Sí, soy mayor de 18</button>
    <button id="gate-no">No</button>
  </div>
</div>

<header class="wrap hero">
  <div class="door">
    <span class="brand" id="brand">Elf Bar</span>
    <h1 class="title" id="titulo">Ice King<small>40.000 puffs</small></h1>
    <div class="chips">
      <span class="chip"><span class="dot"></span>En stock ahora</span>
      <span class="chip" id="chip-n">— sabores</span>
      <span class="chip" id="chip-p" hidden></span>
    </div>
    <div class="offer" id="promo" hidden></div>
  </div>
</header>


<section class="wrap" id="rf" hidden>
  <div class="raffle">
    <div><h2 id="rf-tit">Sorteo de un Ice King</h2><p id="rf-txt">Mandá tu link a 5 amigos. Cuando 2 se anotan, ya estás participando.</p></div>
    <button class="go" id="rf-go">Quiero participar</button>
  </div>
</section>

<div class="sheet" id="rf-sheet" hidden role="dialog" aria-modal="true" aria-labelledby="rf-h">
  <div class="sheet-card" id="rf-card"></div>
</div>

<div class="bar">
  <div class="wrap seg" role="group" aria-label="Filtrar sabores">
    <button data-f="todos" aria-pressed="true">Todos</button>
    <button data-f="ice" aria-pressed="false">❄️ Ice</button>
    <button data-f="noice" aria-pressed="false">Sin ice</button>
  </div>
</div>

<main class="wrap">
  <div id="list"><p class="msg">Cargando sabores…</p></div>
  <p class="upd" id="upd"></p>
</main>

<div class="cart" id="cart">
  <div><small id="cart-n">Elegí tus sabores</small><b class="num" id="cart-t">$ 0</b></div>
  <a class="wa" id="cart-wa" href="#" target="_blank" rel="noopener" aria-disabled="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.6.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.3.8 3.2.7a2.7 2.7 0 0 0 1.8-1.3 2.2 2.2 0 0 0 .2-1.3c-.1-.1-.2-.2-.5-.3Z"/></svg>Pedir</a>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = v => new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(v||0);
const ls = { get:k=>{try{return localStorage.getItem(k)}catch(e){return null}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}} };
// color de cada sabor según su fruta
const COLOR = {'🍇':'#a46bff','🍓':'#ff4f8b','🍉':'#ff5a6e','🫐':'#4f7dff','🥭':'#ffa640','🍌':'#ffd84d','🍒':'#ff3b5c','🍑':'#ff9a76','🍍':'#ffc93c','🍏':'#7dff6b','🍋':'#f4ff5c','🍊':'#ff8a3d','🥝':'#8fe35b','🥥':'#d9d2c3','🍈':'#b8f06a','🍐':'#c9e86a','🌺':'#ff6bd6','🐉':'#ff4fb8','🌿':'#3dffb4','🥤':'#c46a4a','🍂':'#c9934f','☕':'#b07a52','🍦':'#ffe9c2','🍬':'#ff8ce6','⚡':'#ffe14d','💨':'#7fe3ff'};
const colorDe = e => { for(const k of Object.keys(COLOR)) if(String(e||'').startsWith(k)) return COLOR[k]; return '#7fe3ff'; };
// vape ilustrado (diseño propio, genérico)
const vape = (c, w=40) => `<svg viewBox="0 0 40 120" width="${w}" aria-hidden="true"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="${c}"/><stop offset=".55" stop-color="${c}" stop-opacity=".82"/><stop offset="1" stop-color="${c}"/></linearGradient></defs><path d="M13 2h14l2 16H11z" fill="#1b2a38"/><rect x="5" y="16" width="30" height="102" rx="12" fill="url(#g)"/><rect x="9" y="22" width="5" height="78" rx="2.5" fill="#fff" opacity=".35"/><rect x="12" y="74" width="16" height="22" rx="5" fill="#0e1b26" opacity=".85"/><rect x="15" y="78" width="10" height="3" rx="1.5" fill="#7fe8ff" opacity=".9"/><rect x="15" y="84" width="7" height="3" rx="1.5" fill="#7fe8ff" opacity=".55"/></svg>`;
function fridge(colors){
  const cs=colors.length?colors:['#a46bff','#4f7dff','#ff5a6e','#ffa640','#3dffb4','#ff4f8b','#7dff6b','#ff9a76'];
  const W=420, H=210, n=8, step=W/n; let g='';
  for(let r=0;r<2;r++){ const base=r?205:100; const off=r?step/2:0;
    for(let k=-1;k<n;k++){ const c=cs[(k+r*3+cs.length*4)%cs.length]; const x=k*step+off+6;
      g+=`<g transform="translate(${x} ${base-90}) scale(.75)">${vape(c).replace(/id="g"/g,`id="g${r}${k}"`).replace(/url\(#g\)/,`url(#g${r}${k})`).replace(/^<svg[^>]*>|<\/svg>$/g,'')}</g>`; }
    g+=`<rect x="0" y="${base}" width="${W}" height="5" fill="#9fb3c1"/><rect x="0" y="${base+5}" width="${W}" height="3" fill="#7d93a3" opacity=".6"/>`; }
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${g}</svg>`;
  $('fridge').style.backgroundImage=`url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
}
fridge([]);
let CAT=null, cart={}, filtro='todos';
try{ cart=JSON.parse(ls.get('ik_cart')||'{}')||{}; }catch(e){ cart={}; }

if(ls.get('ik_18')!=='1') $('gate').hidden=false;
$('gate-yes').onclick=()=>{ ls.set('ik_18','1'); $('gate').hidden=true; };
$('gate-no').onclick=()=>{ document.body.innerHTML='<p class="msg" style="padding:120px 16px">Este catálogo es solo para mayores de 18 años.</p>'; };
document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ filtro=b.dataset.f; document.querySelectorAll('[data-f]').forEach(x=>x.setAttribute('aria-pressed',String(x===b))); render(); });

const todos = () => CAT?.items || [];
const items = () => todos().filter(i=>!i.agotado);
// descripción de cada sabor: en el item o en un mapa por sabor (catalogo/actual o catalogo/descripciones)
let DESC={};
const kDesc=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
function descDe(i){ const d=i.desc||i.descripcion||i.description; if(d) return String(d);
  const k=kDesc(i.sabor); for(const m of [CAT?.descripciones,CAT?.desc,DESC]){ if(m&&typeof m==='object') for(const [n,v] of Object.entries(m)) if(kDesc(n)===k&&typeof v==='string') return v; } return ''; }
function header(){
  // "ELF BAR ICE KING 40K PUFF" → marca + nombre + puffs
  const t=String(CAT?.titulo||'ELF BAR ICE KING 40K PUFF').trim();
  const m=t.match(/^(elf\s*bar)\s+(.+?)\s+(\d+\s*k)\s*puffs?$/i);
  if(m){ $('brand').textContent=m[1]; $('titulo').innerHTML=`${esc(m[2])}<small>${esc(m[3].replace(/\s/g,'').toUpperCase())} puffs</small>`; }
  else { $('brand').textContent='Catálogo'; $('titulo').innerHTML=esc(t); }
  const n=items().length; $('chip-n').innerHTML=`<b>${n}</b>&nbsp;sabor${n===1?'':'es'}`;
  const ps=[...new Set(items().map(i=>i.precio).filter(Boolean))];
  $('chip-p').hidden=!ps.length; if(ps.length) $('chip-p').innerHTML = ps.length===1 ? `<b>${money(ps[0])}</b>&nbsp;c/u` : `desde&nbsp;<b>${money(Math.min(...ps))}</b>`;
  const pr=promo(); const el=$('promo'); el.hidden=!CAT?.promo;
  if(pr){ const ahorro = pr.unit ? pr.n*pr.unit - pr.precio : 0;
    el.innerHTML=`<span class="lbl">Oferta</span><div class="big"><span class="n">${pr.n}</span><span class="x">×</span><span class="p num">${money(pr.precio)}</span></div>
      <div class="sub">${esc(pr.resto||`Llevá ${pr.n} sabores a elección`)}</div>`; }
  else if(CAT?.promo){ el.innerHTML=`<span class="lbl">Oferta</span><div class="txt">${esc(CAT.promo)}</div>`; }
}
// "2 x $55.000", "2 por 55000 · Entrega en CABA", "3x$80.000"
function promo(){
  const t=String(CAT?.promo||''); const m=t.match(/(\d+)\s*(?:x|×|por)\s*\$?\s*([\d.,]+)/i); if(!m) return null;
  const n=parseInt(m[1],10), precio=parseInt(m[2].replace(/[.,](?=\d{3}\b)/g,'').replace(/[^\d]/g,''),10);
  if(!(n>=2 && precio>1000)) return null;
  const resto=t.replace(m[0],'').replace(/^[\s·\-–|,.:]+|[\s·\-–|,.:]+$/g,'');
  const ps=items().map(i=>i.precio).filter(Boolean); const unit=ps.length?Math.max(...ps):0;
  return {n, precio, resto, unit};
}
// total con la oferta aplicada a los vapes de precio normal
function totalCon(sel){
  const pr=promo(); const lista=[]; sel.forEach(i=>{ for(let k=0;k<cart[i.id];k++) lista.push(i.precio||0); });
  const normal=lista.reduce((a,b)=>a+b,0); if(!pr) return {total:normal, normal, combos:0};
  lista.sort((a,b)=>b-a); const combos=Math.floor(lista.length/pr.n); const restoP=lista.slice(combos*pr.n).reduce((a,b)=>a+b,0);
  const total=Math.min(normal, combos*pr.precio + restoP); return {total, normal, combos: total<normal?combos:0, pr};
}
function render(){
  if(!CAT) return;
  if(CAT.activo===false){ $('list').innerHTML='<p class="msg">El catálogo no está disponible en este momento. Escribinos por WhatsApp.</p>'; updCart(); return; }
  rfBanner(); header(); fridge(items().map(i=>colorDe(i.emoji)));
  const ids=new Set(items().map(i=>i.id)); for(const k of Object.keys(cart)) if(!ids.has(k)) delete cart[k];
  const list=[...items(),...todos().filter(i=>i.agotado)].filter(i=> filtro==='todos' || (filtro==='ice'? i.ice : !i.ice));
  $('list').innerHTML = list.length ? `<div class="grid">${list.map(i=>{ const q=cart[i.id]||0; return `
    <article class="card ${q?'in':''}${i.agotado?' out':''}" style="--c:${colorDe(i.emoji)}">
      <div class="slot" data-slot="${esc(i.id)}"><img src="vape-${modeloDe(i.sabor)}.png?v=1" alt="" width="152" height="316" loading="lazy" decoding="async"></div>
      <div><h2 class="name">${esc(i.sabor)} <span aria-hidden="true">${esc(i.emoji||'')}</span></h2>${descDe(i)?`<p class="desc">${esc(descDe(i))}</p>`:''}<div class="tags">${i.ice?'<span class="tag ice">❄ Ice</span>':''}${i.agotado?'<span class="tag out">Sin stock</span>':''}${!i.agotado&&i.pocas?`<span class="tag low">${i.max?`Quedan ${i.max}`:'Últimas'}</span>`:''}</div>
      <div class="foot"><span class="price num">${i.precio?money(i.precio):'Consultar'}</span>
        ${q?`<div class="qty"><button data-m="${esc(i.id)}" aria-label="Quitar uno de ${esc(i.sabor)}">−</button><span class="num">${q}</span><button data-p="${esc(i.id)}" aria-label="Agregar uno de ${esc(i.sabor)}" ${i.max&&q>=i.max?'disabled':''}>+</button></div>`
           :(i.agotado?'<button class="add" disabled>Sin stock</button>':`<button class="add" data-p="${esc(i.id)}">Agregar</button>`)}</div></div>
    </article>`; }).join('')}</div>` : `<p class="msg">${items().length?'No hay sabores en este filtro.':'Por ahora no hay sabores en stock. Escribinos y te avisamos cuando lleguen.'}</p>`;
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{ const it=items().find(x=>x.id===b.dataset.p); const q=(cart[it.id]||0)+1; if(it.max&&q>it.max) return; cart[it.id]=q; save(); render(); spin(it.id); const c=$('cart'); c.classList.remove('bump'); void c.offsetWidth; c.classList.add('bump'); });
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{ const k=b.dataset.m; cart[k]=(cart[k]||0)-1; if(cart[k]<=0) delete cart[k]; save(); render(); });
  if(CAT.actualizado){ const d=new Date(CAT.actualizado); $('upd').textContent=`Stock actualizado el ${d.toLocaleDateString('es-AR')} a las ${d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})}`; }
  updCart();
}
function save(){ ls.set('ik_cart', JSON.stringify(cart)); }
// color real del Ice King según el sabor
function modeloDe(sabor){ const t=String(sabor||'').toLowerCase();
  if(/blue ?razz|blueberry|mint|menta/.test(t)) return 'blue';
  if(/dragon|grape|uva/.test(t)) return 'purple';
  if(/mango/.test(t)) return 'gold';
  if(/peach|durazno/.test(t)) return 'peach';
  if(/apple|manzana|kiwi/.test(t)) return 'teal';
  if(/water ?melon|sand[ií]a|straw|frutilla|cherry|cranberry|pineapple/.test(t)) return 'red';
  return 'purple'; }
// vuelta 360 + vapor al agregar
function spin(id){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const el=document.querySelector(`[data-slot="${CSS.escape(id)}"]`); if(!el) return;
  el.classList.remove('spin'); void el.offsetWidth; el.classList.add('spin');
  const p=document.createElement('div'); p.className='puff'; p.innerHTML='<span></span><span></span><span></span><span></span>'; el.appendChild(p);
  setTimeout(()=>p.remove(), 2200);
}
// contador anónimo: 1 visita por celular cada 3 horas; ?nocontar desactiva el conteo en ese celular
if(/[?&]nocontar\b/.test(location.search) || /[?&]nocontar\b/.test(document.referrer)) ls.set('ik_nt','1');
function track(tipo){
  if(ls.get('ik_nt')==='1') return;
  try{
    const now=Date.now(), H3=3*3600e3, inc=firebase.firestore.FieldValue.increment(1), f={};
    const d=new Date(), dia=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    if(tipo==='visita'){
      if(now-(Number(ls.get('ik_last'))||0) > H3){ f.visitas=inc; ls.set('ik_last',String(now)); }
      if(!ls.get('ik_seen')){ f.nuevos=inc; ls.set('ik_seen','1'); }
    } else if(tipo==='pedido'){
      if(now-(Number(ls.get('ik_lastp'))||0) > H3){ f.pedidos=inc; ls.set('ik_lastp',String(now)); }
    }
    if(Object.keys(f).length) firebase.firestore().doc('stats/'+dia).set(f,{merge:true}).catch(()=>{});
  }catch(e){}
}
$('cart-wa').addEventListener('click',()=>{ if($('cart-wa').getAttribute('aria-disabled')!=='true') track('pedido'); });
function updCart(){
  const sel=items().filter(i=>cart[i.id]);
  const u=sel.reduce((a,i)=>a+cart[i.id],0); const tc=totalCon(sel); const t=tc.total;
  $('cart-n').innerHTML = u ? `${u} vape${u===1?'':'s'}${tc.combos?` · <span class="save">oferta aplicada −${money(tc.normal-t)}</span>`:(tc.pr&&u%tc.pr.n?` · sumá ${tc.pr.n-u%tc.pr.n} y aplicás la oferta`:'')}` : 'Elegí tus sabores';
  $('cart-t').textContent = money(t);
  const tel=String(CAT?.telefono||'').replace(/\D/g,''); const a=$('cart-wa');
  if(u && tel){
    const txt=`Hola! 👑 Quiero hacer este pedido:\n\n${sel.map(i=>`• ${cart[i.id]} × ${i.sabor} ${i.emoji||''}${i.ice?'❄️':''}`).join('\n')}${tc.combos?`\n\nOferta ${tc.pr.n} × ${money(tc.pr.precio)} (${tc.combos} ${tc.combos>1?'veces':'vez'})`:''}\n\nTotal: ${money(t)}`;
    a.href=`https://api.whatsapp.com/send?phone=${tel}&text=${encodeURIComponent(txt)}`; a.setAttribute('aria-disabled','false');
  } else { a.href='#'; a.setAttribute('aria-disabled','true'); }
}

// ---------- sorteo: cada participante comparte su propio link del catálogo ----------
const rid = n => { const a='abcdefghijkmnpqrstuvwxyz23456789'; let o=''; const r=crypto.getRandomValues(new Uint8Array(n)); for(const x of r) o+=a[x%a.length]; return o; };
let DEV=ls.get('ik_dev'); if(!DEV || !/^[a-z0-9]{12,40}$/.test(DEV)){ DEV=rid(16); ls.set('ik_dev',DEV); }
const REF=(new URLSearchParams(location.search).get('ref')||'').toLowerCase();
const refOk = /^[a-z0-9]{8,20}$/.test(REF);
if(refOk && !ls.get('ik_from')) ls.set('ik_from',REF);
let RF=null; // config del sorteo
const rfMin = () => { const n=parseInt(RF?.minimo,10); return n>=1&&n<=20?n:2; };
const amigos = n => `${n} amigo${n===1?'':'s'}`;
const myId = () => { const x=ls.get('ik_sorteo'); return /^[a-z0-9]{8,20}$/.test(x||'')?x:null; };
const myLink = id => `${location.origin}${location.pathname.replace(/index\.html$/,'')}?ref=${id}`;
function rfBanner(){
  const on=!!(RF && RF.activo && !(CAT&&CAT.activo===false)); $('rf').hidden=!on; if(!on) return;
  $('rf-tit').textContent = `Sorteo de ${RF.premio||'un Ice King'}`;
  $('rf-txt').textContent = myId() ? `Ya te anotaste. Mandá tu link: participás cuando ${amigos(rfMin())} se ${rfMin()===1?'anota':'anotan'} desde él.` : `Mandá tu link a 5 amigos. Cuando ${rfMin()} se ${rfMin()===1?'anota':'anotan'}, ya estás participando.`;
  $('rf-go').textContent = myId() ? 'Ver mi link' : 'Quiero participar';
}
function bases(){
  const f = RF?.fecha ? new Date(RF.fecha+'T12:00:00').toLocaleDateString('es-AR',{day:'numeric',month:'long'}) : null;
  return `Se sortea ${esc(RF?.premio||'un Elf Bar Ice King')}${f?` el ${esc(f)}`:''} entre mayores de 18 que se anoten acá. Para participar, mandá tu link a 5 amigos: quedás adentro cuando al menos ${amigos(rfMin())} se ${rfMin()===1?'anota':'anotan'} al sorteo entrando por tu link, y cada amigo anotado te suma una chance. Anotarte vos mismo desde otro link o desde tu celular no cuenta. No hace falta comprar nada. El ganador se avisa por WhatsApp al número que dejes. Tu número se usa solo para el sorteo y para avisarte de novedades del catálogo; si no querés más mensajes, avisá y te damos de baja.`;
}
function rfOpen(){ rfRender(); $('rf-sheet').hidden=false; setTimeout(()=>{ const f=$('rf-card').querySelector('input,button'); f&&f.focus(); },50); }
function rfClose(){ $('rf-sheet').hidden=true; $('rf-go').focus(); }
function rfRender(){
  const id=myId(); const c=$('rf-card');
  if(!id){
    c.innerHTML=`<h2 id="rf-h">Participá por ${esc(RF?.premio||'un Ice King')}</h2>
      <ol class="steps"><li>Dejá tu nombre y tu WhatsApp.</li><li>Te damos tu link del catálogo.</li><li>Mandalo a 5 amigos. Cuando ${amigos(rfMin())} se ${rfMin()===1?'anota':'anotan'}, ya participás.</li></ol>
      <form id="rf-f" novalidate style="display:grid;gap:12px">
        <label>Tu nombre<input type="text" id="rf-n" maxlength="40" autocomplete="name" required></label>
        <label>Tu WhatsApp<input type="tel" id="rf-t" maxlength="20" inputmode="tel" autocomplete="tel" placeholder="11 2345-6789" required></label>
        <label class="chk"><input type="checkbox" id="rf-ok"> <span>Soy mayor de 18 y acepto que me escriban por WhatsApp para el sorteo y novedades del catálogo.</span></label>
        <details><summary>Bases del sorteo</summary><p style="margin-top:6px">${bases()}</p></details>
        <div class="err" id="rf-err" role="alert"></div>
        <button class="primary" type="submit" id="rf-send">Anotarme y ver mi link</button>
        <button class="close" type="button" data-rf-close>Ahora no</button>
      </form>`;
    $('rf-f').onsubmit=async e=>{ e.preventDefault();
      const n=$('rf-n').value.trim(), t=$('rf-t').value.trim(), dig=t.replace(/\D/g,'');
      if(!n) return $('rf-err').textContent='Escribí tu nombre.';
      if(dig.length<8||dig.length>15) return $('rf-err').textContent='Revisá el número: tiene que tener el código de área, por ejemplo 11 2345-6789.';
      if(!$('rf-ok').checked) return $('rf-err').textContent='Para participar tenés que aceptar las bases.';
      $('rf-send').disabled=true; $('rf-err').textContent='';
      const nid=rid(10); const from=ls.get('ik_from'); const d={nombre:n.slice(0,40), tel:t.slice(0,20), dev:DEV, creado:Date.now()};
      if(from && /^[a-z0-9]{8,20}$/.test(from)) d.ref=from;
      try{ await firebase.firestore().doc('sorteo/'+nid).set(d); ls.set('ik_sorteo',nid); rfBanner(); rfRender(); }
      catch(err){ console.error(err); $('rf-send').disabled=false; $('rf-err').textContent='No se pudo anotar. Probá de nuevo en un rato.'; }
    };
  } else {
    const link=myLink(id);
    const msg=`Mirá este catálogo de vapes 👀❄️ Están sorteando ${RF?.premio||'un Ice King'}: entrá y anotate vos también, así los dos participamos 🎁\n${link}`;
    c.innerHTML=`<h2 id="rf-h">Ya estás anotado</h2>
      <p>Mandale este link a 5 amigos. Para participar, ${amigos(rfMin())} se ${rfMin()===1?'tiene':'tienen'} que anotar al sorteo desde tu link. Cada amigo anotado te suma una chance.</p>
      <div class="mylink"><input id="rf-link" readonly value="${esc(link)}" aria-label="Tu link"><button type="button" id="rf-copy">Copiar</button></div>
      <a class="wa" id="rf-share" href="https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Z"/></svg>Compartir por WhatsApp</a>
      <details><summary>Bases del sorteo</summary><p style="margin-top:6px">${bases()}</p></details>
      <button class="close" type="button" data-rf-close>Cerrar</button>`;
    $('rf-copy').onclick=async()=>{ try{ await navigator.clipboard.writeText(link); $('rf-copy').textContent='Copiado'; }catch(e){ $('rf-link').select(); } };
  }
  c.querySelectorAll('[data-rf-close]').forEach(b=>b.onclick=rfClose);
}
$('rf-go').onclick=rfOpen;
$('rf-sheet').addEventListener('click',e=>{ if(e.target===$('rf-sheet')) rfClose(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && !$('rf-sheet').hidden) rfClose(); });
function rfVisit(){
  // una visita por celular a cada link; tu propio link no cuenta
  if(!refOk || REF===myId()) return;
  const k='ik_v_'+REF; if(ls.get(k)) return;
  firebase.firestore().doc(`sorteo/${REF}/visitas/${DEV}`).set({t:Date.now()}).then(()=>ls.set(k,'1')).catch(()=>ls.set(k,'1'));
}
try{
  firebase.initializeApp(window.FIREBASE_CONFIG);
  track('visita');
  rfVisit();
  firebase.firestore().doc('catalogo/sorteo').onSnapshot(d=>{ RF=d.exists?d.data():null; rfBanner(); },()=>{});
  firebase.firestore().doc('catalogo/descripciones').onSnapshot(d=>{ const x=d.exists?d.data():{}; DESC=(x.items&&typeof x.items==='object'&&!Array.isArray(x.items))?x.items:(x.descripciones||x); render(); },()=>{});
firebase.firestore().doc('catalogo/actual').onSnapshot(d=>{ CAT = d.exists ? d.data() : {items:[]}; render(); },
    err=>{ console.error(err); $('list').innerHTML='<p class="msg">No se pudo cargar el catálogo. Probá de nuevo en un rato.</p>'; });
}catch(e){ $('list').innerHTML='<p class="msg">No se pudo cargar el catálogo.</p>'; }
})();
</script>
