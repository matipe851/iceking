<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#05070f">
<title>Ice King · Sabores</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E❄️%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: aurora background + snow layer (fixed) · hero · sticky filter bar · flavor grid (1 col → 2 → 3) · floating cart pill */
:root{
  --bg:#05070f; --ink:#eaf6ff; --muted:#8ea3bd; --line:rgba(170,220,255,.14);
  --glass:rgba(16,24,44,.55); --glass-2:rgba(24,36,64,.6);
  --ice:#7fe3ff; --ice-2:#b9f2ff; --violet:#a98bff; --wa:#3ef08a;
  --display:"Unbounded","Manrope",system-ui,sans-serif; --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;background:var(--bg);overflow-x:hidden;padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--ice);outline-offset:3px}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* background: aurora + frost grain */
.sky{position:fixed;inset:0;z-index:-2;overflow:hidden;pointer-events:none}
.sky::before,.sky::after{content:"";position:absolute;width:120vmax;height:120vmax;border-radius:50%;filter:blur(90px);opacity:.55}
.sky::before{left:-40vmax;top:-70vmax;background:radial-gradient(circle,#1fb6ff 0%,transparent 60%)}
.sky::after{right:-50vmax;top:-40vmax;background:radial-gradient(circle,#7b4dff 0%,transparent 58%);opacity:.45}
.sky i{position:absolute;left:10%;bottom:-60vmax;width:90vmax;height:90vmax;border-radius:50%;background:radial-gradient(circle,#00ffd1 0%,transparent 60%);filter:blur(100px);opacity:.14}
.snow{position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:
  radial-gradient(1.5px 1.5px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 120px 80px,#cfefff,transparent),
  radial-gradient(1.5px 1.5px at 200px 160px,#fff,transparent),radial-gradient(1px 1px at 60px 210px,#bfe9ff,transparent),
  radial-gradient(2px 2px at 260px 40px,#fff,transparent),radial-gradient(1px 1px at 300px 240px,#dff6ff,transparent);
  background-size:320px 280px;opacity:.35}
@media (prefers-reduced-motion:no-preference){
  .snow{animation:fall 28s linear infinite}
  @keyframes fall{to{background-position:0 280px}}
  .card{transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease}
  .card:hover{transform:translateY(-3px)}
  .crown{animation:float 6s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-6px)}}
}

.wrap{max-width:1040px;margin:0 auto;padding-inline:16px}

/* hero */
.hero{padding-top:calc(34px + env(safe-area-inset-top,0px));padding-bottom:10px;text-align:center;display:grid;justify-items:center;gap:12px}
.crown{font-size:34px;filter:drop-shadow(0 0 18px rgba(127,227,255,.7))}
.brand{font-family:var(--display);font-weight:500;font-size:12px;letter-spacing:.42em;text-transform:uppercase;color:var(--ice-2);opacity:.9}
.title{margin:0;font-family:var(--display);font-weight:900;font-size:clamp(46px,14vw,112px);line-height:.88;letter-spacing:-.03em;text-transform:uppercase;
  background:linear-gradient(180deg,#ffffff 0%,#d9f6ff 38%,#7fe3ff 70%,#6b8cff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 40px rgba(127,227,255,.25)}
.title small{display:block;font-size:.34em;letter-spacing:.06em;margin-top:.25em;-webkit-text-fill-color:transparent}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:99px;border:1px solid var(--line);background:rgba(127,227,255,.06);font-size:13px;font-weight:700;color:var(--ice-2);backdrop-filter:blur(8px)}
.chip b{color:#fff}
.dot{width:7px;height:7px;border-radius:50%;background:var(--wa);box-shadow:0 0 10px var(--wa)}
.promo{max-width:560px;width:100%;margin-top:6px;padding:12px 16px;border-radius:16px;border:1px solid rgba(127,227,255,.35);
  background:linear-gradient(120deg,rgba(127,227,255,.16),rgba(169,139,255,.16));box-shadow:0 0 30px rgba(127,227,255,.12) inset;font-weight:800;white-space:pre-line}

/* big offer */
.offer{position:relative;width:100%;max-width:620px;margin-top:10px;padding:18px 18px 16px;border-radius:28px;overflow:hidden;text-align:center;
  border:1px solid rgba(185,242,255,.55);background:linear-gradient(135deg,rgba(127,227,255,.28),rgba(169,139,255,.30));
  box-shadow:0 0 0 1px rgba(255,255,255,.06) inset,0 20px 60px -20px rgba(127,227,255,.75),0 0 80px -30px rgba(169,139,255,.9)}
.offer::before{content:"";position:absolute;inset:-40% -10% auto;height:120%;background:radial-gradient(closest-side,rgba(255,255,255,.22),transparent);transform:rotate(-8deg);pointer-events:none}
.offer .lbl{display:inline-block;font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:#04121c;background:linear-gradient(135deg,#fff,var(--ice));padding:6px 14px;border-radius:99px}
.offer .big{display:flex;align-items:baseline;justify-content:center;gap:.18em;flex-wrap:wrap;margin:8px 0 2px;font-family:var(--display);font-weight:900;line-height:.95;letter-spacing:-.04em;color:#fff;text-shadow:0 0 30px rgba(127,227,255,.6)}
.offer .n{font-size:clamp(64px,20vw,128px)}
.offer .x{font-size:clamp(34px,10vw,64px);color:var(--ice-2)}
.offer .p{font-size:clamp(40px,12.5vw,88px);background:linear-gradient(180deg,#fff,#b9f2ff 60%,#7fe3ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.offer .sub{font-weight:700;color:var(--ice-2);font-size:14px}
.offer .txt{font-family:var(--display);font-weight:700;font-size:clamp(22px,6vw,34px);line-height:1.15;color:#fff;margin:10px 0 2px;white-space:pre-line}
@media (prefers-reduced-motion:no-preference){ .offer{animation:pulse 3.2s ease-in-out infinite} @keyframes pulse{50%{box-shadow:0 0 0 1px rgba(255,255,255,.06) inset,0 24px 70px -18px rgba(127,227,255,.95),0 0 100px -26px rgba(169,139,255,1)}} }
.save{color:var(--wa);font-weight:800}

/* filters */
.bar{position:sticky;top:0;z-index:4;padding:12px 0;margin-top:14px;background:linear-gradient(var(--bg) 60%,transparent)}
.seg{display:flex;gap:6px;justify-content:center}
.seg button{border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px);border-radius:99px;padding:9px 16px;font-weight:800;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{color:#04121c;background:linear-gradient(135deg,var(--ice-2),var(--ice));border-color:transparent;box-shadow:0 0 22px rgba(127,227,255,.45)}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px;padding-top:6px}
.card{--c:#7fe3ff;position:relative;overflow:hidden;border-radius:22px;padding:16px;border:1px solid var(--line);
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 14%,transparent),var(--glass) 55%);backdrop-filter:blur(14px);
  display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.card::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 55%,transparent),transparent 70%);opacity:.35;pointer-events:none}
.card.in{border-color:color-mix(in srgb,var(--c) 70%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 40%,transparent),0 10px 40px -10px color-mix(in srgb,var(--c) 60%,transparent)}
.orb{width:72px;height:72px;border-radius:20px;display:grid;place-items:center;font-size:30px;letter-spacing:-6px;padding-right:6px;white-space:nowrap;
  background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.25),transparent 45%),linear-gradient(145deg,color-mix(in srgb,var(--c) 55%,#0b1222),#0b1222);
  border:1px solid rgba(255,255,255,.12);box-shadow:0 8px 30px -8px color-mix(in srgb,var(--c) 80%,transparent)}
.name{margin:0;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.01em;line-height:1.15;text-wrap:balance}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.tag{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:99px}
.tag.ice{color:#04121c;background:linear-gradient(135deg,var(--ice-2),var(--ice))}
.tag.low{color:#ffd28a;background:rgba(255,190,90,.14);border:1px solid rgba(255,190,90,.35)}
.foot{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:12px;border-top:1px dashed rgba(170,220,255,.14)}
.price{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:-.02em}
.add{border:0;border-radius:14px;padding:11px 18px;font-weight:800;color:#04121c;background:linear-gradient(135deg,#fff,var(--ice));box-shadow:0 6px 24px -6px rgba(127,227,255,.7)}
.qty{display:flex;align-items:center;gap:2px;border-radius:14px;padding:3px;background:rgba(0,0,0,.35);border:1px solid var(--line)}
.qty button{width:40px;height:40px;border:0;border-radius:11px;background:transparent;font-size:20px;font-weight:800}
.qty button:hover{background:rgba(127,227,255,.12)}
.qty button:disabled{opacity:.3;cursor:not-allowed}
.qty span{min-width:24px;text-align:center;font-weight:800;font-size:16px}
.msg{color:var(--muted);text-align:center;padding:60px 16px}
.upd{color:var(--muted);font-size:12.5px;text-align:center;padding:30px 0 6px}

/* cart */
.cart{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:6;width:min(560px,calc(100% - 24px));
  display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 10px 10px 18px;border-radius:22px;
  background:rgba(10,16,30,.82);backdrop-filter:blur(16px);border:1px solid rgba(127,227,255,.25);box-shadow:0 20px 50px -12px rgba(0,0,0,.8),0 0 30px -10px rgba(127,227,255,.5)}
.cart small{display:block;color:var(--muted);font-size:12.5px;font-weight:600}
.cart b{font-family:var(--display);font-size:20px;letter-spacing:-.02em}
.wa{display:inline-flex;align-items:center;gap:8px;border-radius:16px;padding:13px 18px;font-weight:800;text-decoration:none;white-space:nowrap;color:#032a14;background:linear-gradient(135deg,#8dffbe,var(--wa));box-shadow:0 8px 26px -8px rgba(62,240,138,.8)}
.wa[aria-disabled="true"]{filter:grayscale(1);opacity:.4;pointer-events:none;box-shadow:none}
.wa svg{width:19px;height:19px;fill:currentColor}

/* age gate */
.gate{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:24px 16px;background:rgba(3,5,12,.86);backdrop-filter:blur(14px)}
.gate-card{width:100%;max-width:380px;text-align:center;display:grid;gap:14px;padding:30px 24px;border-radius:26px;border:1px solid rgba(127,227,255,.3);
  background:linear-gradient(160deg,rgba(127,227,255,.12),rgba(16,24,44,.9) 50%);box-shadow:0 0 60px -20px rgba(127,227,255,.6)}
.gate-card .crown{font-size:40px}
.gate-card h2{margin:0;font-family:var(--display);font-size:22px;font-weight:700}
.gate-card p{margin:0;color:var(--muted);font-size:14px}
.gate-card button{border-radius:16px;padding:14px;font-weight:800;border:1px solid var(--line);background:transparent}
.gate-card .yes{border:0;color:#04121c;background:linear-gradient(135deg,#fff,var(--ice));box-shadow:0 8px 30px -8px rgba(127,227,255,.8)}
</style>
</head>
<body>
<div class="sky" aria-hidden="true"><i></i></div>
<div class="snow" aria-hidden="true"></div>

<div class="gate" id="gate" hidden>
  <div class="gate-card">
    <div class="crown" aria-hidden="true">❄️</div>
    <h2>¿Sos mayor de 18?</h2>
    <p>Productos con nicotina. Solo para mayores de edad.</p>
    <button class="yes" id="gate-yes">Sí, soy mayor de 18</button>
    <button id="gate-no">No</button>
  </div>
</div>

<header class="wrap hero">
  <div class="crown" aria-hidden="true">👑</div>
  <span class="brand" id="brand">Elf Bar</span>
  <h1 class="title" id="titulo">Ice King<small>40.000 puffs</small></h1>
  <div class="chips">
    <span class="chip"><span class="dot"></span>Stock real</span>
    <span class="chip" id="chip-n">— sabores</span>
    <span class="chip" id="chip-p" hidden></span>
  </div>
  <div class="offer" id="promo" hidden></div>
</header>

<div class="bar">
  <div class="wrap seg" role="group" aria-label="Filtrar sabores">
    <button data-f="todos" aria-pressed="true">Todos</button>
    <button data-f="ice" aria-pressed="false">❄️ Ice</button>
    <button data-f="noice" aria-pressed="false">Sin hielo</button>
  </div>
</div>

<main class="wrap">
  <div id="list"><p class="msg">Cargando sabores…</p></div>
  <p class="upd" id="upd"></p>
</main>

<div class="cart" id="cart">
  <div><small id="cart-n">Elegí tus sabores</small><b class="num" id="cart-t">$ 0</b></div>
  <a class="wa" id="cart-wa" href="#" target="_blank" rel="noopener" aria-disabled="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.6.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.3.8 3.2.7a2.7 2.7 0 0 0 1.8-1.3 2.2 2.2 0 0 0 .2-1.3c-.1-.1-.2-.2-.5-.3Z"/></svg>Pedir</a>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = v => new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(v||0);
const ls = { get:k=>{try{return localStorage.getItem(k)}catch(e){return null}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}} };
// color de cada sabor según su fruta
const COLOR = {'🍇':'#a46bff','🍓':'#ff4f8b','🍉':'#ff5a6e','🫐':'#4f7dff','🥭':'#ffa640','🍌':'#ffd84d','🍒':'#ff3b5c','🍑':'#ff9a76','🍍':'#ffc93c','🍏':'#7dff6b','🍋':'#f4ff5c','🍊':'#ff8a3d','🥝':'#8fe35b','🥥':'#d9d2c3','🍈':'#b8f06a','🍐':'#c9e86a','🌺':'#ff6bd6','🐉':'#ff4fb8','🌿':'#3dffb4','🥤':'#c46a4a','🍂':'#c9934f','☕':'#b07a52','🍦':'#ffe9c2','🍬':'#ff8ce6','⚡':'#ffe14d','💨':'#7fe3ff'};
const colorDe = e => { for(const k of Object.keys(COLOR)) if(String(e||'').startsWith(k)) return COLOR[k]; return '#7fe3ff'; };
let CAT=null, cart={}, filtro='todos';
try{ cart=JSON.parse(ls.get('ik_cart')||'{}')||{}; }catch(e){ cart={}; }

if(ls.get('ik_18')!=='1') $('gate').hidden=false;
$('gate-yes').onclick=()=>{ ls.set('ik_18','1'); $('gate').hidden=true; };
$('gate-no').onclick=()=>{ document.body.innerHTML='<p class="msg" style="padding:120px 16px">Este catálogo es solo para mayores de 18 años.</p>'; };
document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ filtro=b.dataset.f; document.querySelectorAll('[data-f]').forEach(x=>x.setAttribute('aria-pressed',String(x===b))); render(); });

const items = () => CAT?.items || [];
function header(){
  // "ELF BAR ICE KING 40K PUFF" → marca + nombre + puffs
  const t=String(CAT?.titulo||'ELF BAR ICE KING 40K PUFF').trim();
  const m=t.match(/^(elf\s*bar)\s+(.+?)\s+(\d+\s*k)\s*puffs?$/i);
  if(m){ $('brand').textContent=m[1]; $('titulo').innerHTML=`${esc(m[2])}<small>${esc(m[3].replace(/\s/g,'').toUpperCase())} puffs</small>`; }
  else { $('brand').textContent='Catálogo'; $('titulo').innerHTML=esc(t); }
  const n=items().length; $('chip-n').innerHTML=`<b>${n}</b>&nbsp;sabor${n===1?'':'es'}`;
  const ps=[...new Set(items().map(i=>i.precio).filter(Boolean))];
  $('chip-p').hidden=!ps.length; if(ps.length) $('chip-p').innerHTML = ps.length===1 ? `<b>${money(ps[0])}</b>&nbsp;c/u` : `desde&nbsp;<b>${money(Math.min(...ps))}</b>`;
  const pr=promo(); const el=$('promo'); el.hidden=!CAT?.promo;
  if(pr){ const ahorro = pr.unit ? pr.n*pr.unit - pr.precio : 0;
    el.innerHTML=`<span class="lbl">Oferta</span><div class="big"><span class="n">${pr.n}</span><span class="x">×</span><span class="p num">${money(pr.precio)}</span></div>
      <div class="sub">${esc(pr.resto||`Llevá ${pr.n} sabores a elección`)}${ahorro>0?` · <span class="save">ahorrás ${money(ahorro)}</span>`:''}</div>`; }
  else if(CAT?.promo){ el.innerHTML=`<span class="lbl">Oferta</span><div class="txt">${esc(CAT.promo)}</div>`; }
}
// "2 x $55.000", "2 por 55000 · Entrega en CABA", "3x$80.000"
function promo(){
  const t=String(CAT?.promo||''); const m=t.match(/(\d+)\s*(?:x|×|por)\s*\$?\s*([\d.,]+)/i); if(!m) return null;
  const n=parseInt(m[1],10), precio=parseInt(m[2].replace(/[.,](?=\d{3}\b)/g,'').replace(/[^\d]/g,''),10);
  if(!(n>=2 && precio>1000)) return null;
  const resto=t.replace(m[0],'').replace(/^[\s·\-–|,.:]+|[\s·\-–|,.:]+$/g,'');
  const ps=items().map(i=>i.precio).filter(Boolean); const unit=ps.length?Math.max(...ps):0;
  return {n, precio, resto, unit};
}
// total con la oferta aplicada a los vapes de precio normal
function totalCon(sel){
  const pr=promo(); const lista=[]; sel.forEach(i=>{ for(let k=0;k<cart[i.id];k++) lista.push(i.precio||0); });
  const normal=lista.reduce((a,b)=>a+b,0); if(!pr) return {total:normal, normal, combos:0};
  lista.sort((a,b)=>b-a); const combos=Math.floor(lista.length/pr.n); const restoP=lista.slice(combos*pr.n).reduce((a,b)=>a+b,0);
  const total=Math.min(normal, combos*pr.precio + restoP); return {total, normal, combos: total<normal?combos:0, pr};
}
function render(){
  if(!CAT) return;
  if(CAT.activo===false){ $('list').innerHTML='<p class="msg">El catálogo no está disponible en este momento. Escribinos por WhatsApp.</p>'; updCart(); return; }
  header();
  const ids=new Set(items().map(i=>i.id)); for(const k of Object.keys(cart)) if(!ids.has(k)) delete cart[k];
  const list=items().filter(i=> filtro==='todos' || (filtro==='ice'? i.ice : !i.ice));
  $('list').innerHTML = list.length ? `<div class="grid">${list.map(i=>{ const q=cart[i.id]||0; return `
    <article class="card ${q?'in':''}" style="--c:${colorDe(i.emoji)}">
      <div class="orb" aria-hidden="true">${esc(i.emoji||'💨')}</div>
      <div><h2 class="name">${esc(i.sabor)}</h2><div class="tags">${i.ice?'<span class="tag ice">❄ Ice</span>':''}${i.pocas?'<span class="tag low">Últimas</span>':''}</div></div>
      <div class="foot"><span class="price num">${i.precio?money(i.precio):'Consultar'}</span>
        ${q?`<div class="qty"><button data-m="${esc(i.id)}" aria-label="Quitar uno de ${esc(i.sabor)}">−</button><span class="num">${q}</span><button data-p="${esc(i.id)}" aria-label="Agregar uno de ${esc(i.sabor)}" ${i.max&&q>=i.max?'disabled':''}>+</button></div>`
           :`<button class="add" data-p="${esc(i.id)}">Agregar</button>`}</div>
    </article>`; }).join('')}</div>` : `<p class="msg">${items().length?'No hay sabores en este filtro.':'Por ahora no hay sabores en stock. Escribinos y te avisamos cuando lleguen.'}</p>`;
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{ const it=items().find(x=>x.id===b.dataset.p); const q=(cart[it.id]||0)+1; if(it.max&&q>it.max) return; cart[it.id]=q; save(); render(); });
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{ const k=b.dataset.m; cart[k]=(cart[k]||0)-1; if(cart[k]<=0) delete cart[k]; save(); render(); });
  if(CAT.actualizado){ const d=new Date(CAT.actualizado); $('upd').textContent=`Stock actualizado el ${d.toLocaleDateString('es-AR')} a las ${d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})}`; }
  updCart();
}
function save(){ ls.set('ik_cart', JSON.stringify(cart)); }
function updCart(){
  const sel=items().filter(i=>cart[i.id]);
  const u=sel.reduce((a,i)=>a+cart[i.id],0); const tc=totalCon(sel); const t=tc.total;
  $('cart-n').innerHTML = u ? `${u} vape${u===1?'':'s'}${tc.combos?` · <span class="save">oferta aplicada −${money(tc.normal-t)}</span>`:(tc.pr&&u%tc.pr.n?` · sumá ${tc.pr.n-u%tc.pr.n} y aplicás la oferta`:'')}` : 'Elegí tus sabores';
  $('cart-t').textContent = money(t);
  const tel=String(CAT?.telefono||'').replace(/\D/g,''); const a=$('cart-wa');
  if(u && tel){
    const txt=`Hola! 👑 Quiero hacer este pedido:\n\n${sel.map(i=>`• ${cart[i.id]} × ${i.sabor} ${i.emoji||''}${i.ice?'❄️':''}`).join('\n')}${tc.combos?`\n\nOferta ${tc.pr.n} × ${money(tc.pr.precio)} (${tc.combos} ${tc.combos>1?'veces':'vez'})`:''}\n\nTotal: ${money(t)}`;
    a.href=`https://api.whatsapp.com/send?phone=${tel}&text=${encodeURIComponent(txt)}`; a.setAttribute('aria-disabled','false');
  } else { a.href='#'; a.setAttribute('aria-disabled','true'); }
}
try{
  firebase.initializeApp(window.FIREBASE_CONFIG);
  firebase.firestore().doc('catalogo/actual').onSnapshot(d=>{ CAT = d.exists ? d.data() : {items:[]}; render(); },
    err=>{ console.error(err); $('list').innerHTML='<p class="msg">No se pudo cargar el catálogo. Probá de nuevo en un rato.</p>'; });
}catch(e){ $('list').innerHTML='<p class="msg">No se pudo cargar el catálogo.</p>'; }
})();
</script>
